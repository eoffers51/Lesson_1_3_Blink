# CI/CD for the police siren firmware.
#   - every push / pull request: run the host tests and build the firmware
#   - push a tag like v1.0.0: also publish a GitHub Release with the firmware
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IDF_VERSION: v6.0.2

jobs:
  host-tests:
    name: Host tests (Unity)
    runs-on: ubuntu-latest
    # The ESP-IDF image has Unity (taken from IDF_PATH), cmake and ninja
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4

      - name: Install host gcc
        run: command -v gcc || (apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev)

      - name: Build and run tests
        run: |
          cmake -S host_test -B host_test/build -G Ninja -DCMAKE_C_COMPILER=gcc -DIDF_PATH="$IDF_PATH"
          cmake --build host_test/build
          ./host_test/build/host_test

  firmware:
    name: Build firmware (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: idf.py build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          # merge-bin makes one image that can be flashed at 0x0
          command: idf.py build && idf.py merge-bin

      - name: Collect binaries
        run: |
          mkdir -p dist
          sudo cp build/merged-binary.bin dist/Lesson_1_3_Blink-merged.bin
          sudo cp build/Lesson_1_3_Blink.bin build/Lesson_1_3_Blink.elf build/flasher_args.json dist/
          sudo cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin dist/
          sudo chown -R "$(id -u)" dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: dist/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
