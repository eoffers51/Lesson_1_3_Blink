<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 800 600" width="800" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Wiring of the police siren lights (lesson 1.3). Same pins as main/main.c and diagram.json. -->
  <rect x="0" y="-50" width="800" height="600" rx="16" fill="#ffffff"/>
  <text x="24" y="-18" font-size="20" font-weight="700" fill="#202124">Police siren — wiring</text>
  <text x="24" y="2" font-size="13" fill="#5f6368">ESP32-S3-DevKitC-1 · resistors 220–330 Ω · all LEDs external except the RGB</text>

  <!-- ===== Board ===== -->
  <rect x="320" y="30" width="180" height="480" rx="10" fill="#1f2a36"/>
  <rect x="378" y="40" width="64" height="20" rx="2" fill="#2c3a48"/>            <!-- antenna -->
  <rect x="372" y="62" width="76" height="120" rx="4" fill="#b8bec6"/>          <!-- module shield -->
  <text x="410" y="118" font-size="10" fill="#3c4043" text-anchor="middle" font-weight="700">ESP32-S3</text>
  <text x="410" y="132" font-size="9" fill="#3c4043" text-anchor="middle">WROOM-1</text>
  <rect x="380" y="512" width="34" height="18" rx="3" fill="#9aa0a6"/>          <!-- USB -->
  <rect x="426" y="512" width="34" height="18" rx="3" fill="#9aa0a6"/>
  <text x="397" y="545" font-size="9" fill="#5f6368" text-anchor="middle">UART</text>
  <text x="443" y="545" font-size="9" fill="#5f6368" text-anchor="middle">USB</text>

  <!-- J1 header (left), top to bottom; used pins are bright -->
  <g font-size="9" fill="#8a96a3">
    <g fill="#5d6873">
      <rect x="327" y="65" width="10" height="10"/><rect x="327" y="83" width="10" height="10"/><rect x="327" y="101" width="10" height="10"/><rect x="327" y="119" width="10" height="10"/><rect x="327" y="137" width="10" height="10"/><rect x="327" y="155" width="10" height="10"/><rect x="327" y="173" width="10" height="10"/><rect x="327" y="191" width="10" height="10"/><rect x="327" y="209" width="10" height="10"/><rect x="327" y="227" width="10" height="10"/><rect x="327" y="245" width="10" height="10"/><rect x="327" y="263" width="10" height="10"/><rect x="327" y="281" width="10" height="10"/><rect x="327" y="299" width="10" height="10"/><rect x="327" y="317" width="10" height="10"/><rect x="327" y="335" width="10" height="10"/><rect x="327" y="353" width="10" height="10"/><rect x="327" y="371" width="10" height="10"/><rect x="327" y="389" width="10" height="10"/><rect x="327" y="407" width="10" height="10"/><rect x="327" y="425" width="10" height="10"/><rect x="327" y="443" width="10" height="10"/>
    </g>
    <text x="343" y="91">3V3</text><text x="343" y="109">RST</text><text x="343" y="127">4</text><text x="343" y="145">5</text><text x="343" y="163">6</text><text x="343" y="181">7</text><text x="343" y="199">15</text><text x="343" y="217">16</text><text x="343" y="235">17</text><text x="343" y="253">18</text><text x="343" y="289">3</text><text x="343" y="307">46</text><text x="343" y="343">10</text><text x="343" y="361">11</text><text x="343" y="379">12</text><text x="343" y="397">13</text><text x="343" y="415">14</text><text x="343" y="433">5V</text>
  </g>
  <!-- J3 header (right) -->
  <g font-size="9" fill="#8a96a3" text-anchor="end">
    <g fill="#5d6873">
      <rect x="483" y="65" width="10" height="10"/><rect x="483" y="83" width="10" height="10"/><rect x="483" y="101" width="10" height="10"/><rect x="483" y="119" width="10" height="10"/><rect x="483" y="137" width="10" height="10"/><rect x="483" y="155" width="10" height="10"/><rect x="483" y="173" width="10" height="10"/><rect x="483" y="191" width="10" height="10"/><rect x="483" y="209" width="10" height="10"/><rect x="483" y="227" width="10" height="10"/><rect x="483" y="245" width="10" height="10"/><rect x="483" y="263" width="10" height="10"/><rect x="483" y="281" width="10" height="10"/><rect x="483" y="299" width="10" height="10"/><rect x="483" y="317" width="10" height="10"/><rect x="483" y="335" width="10" height="10"/><rect x="483" y="353" width="10" height="10"/><rect x="483" y="371" width="10" height="10"/><rect x="483" y="389" width="10" height="10"/><rect x="483" y="407" width="10" height="10"/><rect x="483" y="425" width="10" height="10"/><rect x="483" y="443" width="10" height="10"/>
    </g>
    <text x="477" y="73">G</text><text x="477" y="91">TX</text><text x="477" y="109">RX</text><text x="477" y="127">1</text><text x="477" y="145">2</text><text x="477" y="163">42</text><text x="477" y="181">41</text><text x="477" y="199">40</text><text x="477" y="217">39</text><text x="477" y="235">38</text><text x="477" y="253">37</text><text x="477" y="271">36</text><text x="477" y="289">35</text><text x="477" y="307">0</text><text x="477" y="325">45</text><text x="477" y="343">48</text><text x="477" y="361">47</text><text x="477" y="379">21</text><text x="477" y="397">20</text><text x="477" y="415">19</text><text x="477" y="433">G</text><text x="477" y="451">G</text>
  </g>
  <!-- used pins highlighted -->
  <g fill="#f9ab00">
    <rect x="327" y="65" width="10" height="10"/><rect x="327" y="263" width="10" height="10"/><rect x="327" y="317" width="10" height="10"/><rect x="327" y="443" width="10" height="10"/>
  </g>
  <g font-size="10" font-weight="700" fill="#ffffff">
    <text x="343" y="73">3V3</text><text x="343" y="271">8</text><text x="343" y="325">9</text><text x="343" y="451">G</text>
  </g>

  <!-- onboard RGB LED (GPIO48) and BOOT button (GPIO0) -->
  <rect x="398" y="290" width="24" height="24" rx="3" fill="#ffffff"/>
  <circle cx="410" cy="302" r="7" fill="url(#rgb)"/>
  <text x="410" y="328" font-size="9" fill="#e8eaed" text-anchor="middle">RGB</text>
  <rect x="362" y="470" width="24" height="24" rx="3" fill="#dadce0"/>
  <circle cx="374" cy="482" r="7" fill="#3c4043"/>
  <text x="374" y="465" font-size="9" fill="#e8eaed" text-anchor="middle">BOOT</text>
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea4335"/><stop offset="0.5" stop-color="#34a853"/><stop offset="1" stop-color="#4285f4"/>
    </linearGradient>
  </defs>

  <!-- ===== Wires ===== -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 70 H290 V95" stroke="#d93025"/>                      <!-- 3V3 -->
    <path d="M290 145 V165" stroke="#188038"/>                         <!-- R -> green anode -->
    <path d="M290 197 V268" stroke="#188038"/>                         <!-- green cathode -> GPIO8 -->
    <path d="M332 268 H240" stroke="#1a73e8"/>                         <!-- GPIO8 -> blue R -->
    <path d="M190 268 H160" stroke="#1a73e8"/>
    <path d="M332 322 H240" stroke="#e8710a"/>                         <!-- GPIO9 -> red R -->
    <path d="M190 322 H160" stroke="#e8710a"/>
    <path d="M124 268 H70 V448 H332 M124 322 H70" stroke="#3c4043"/>   <!-- cathodes -> GND -->
  </g>
  <circle cx="290" cy="268" r="6" fill="#1a73e8"/>
  <circle cx="70" cy="322" r="6" fill="#3c4043"/>
  <text x="316" y="262" text-anchor="end" font-size="10" fill="#1a73e8" font-weight="700">GPIO8</text>
  <text x="316" y="316" text-anchor="end" font-size="10" fill="#e8710a" font-weight="700">GPIO9</text>
  <text x="316" y="64" text-anchor="end" font-size="10" fill="#d93025" font-weight="700">3V3</text>
  <text x="200" y="442" font-size="10" fill="#3c4043" font-weight="700">GND</text>

  <!-- ===== Resistors ===== -->
  <g stroke="#8d6e3f" stroke-width="1">
    <rect x="283" y="95" width="14" height="50" rx="6" fill="#e8d2a6"/>
    <rect x="190" y="261" width="50" height="14" rx="6" fill="#e8d2a6"/>
    <rect x="190" y="315" width="50" height="14" rx="6" fill="#e8d2a6"/>
  </g>
  <g fill="#c5221f">
    <rect x="283" y="104" width="14" height="4"/><rect x="283" y="112" width="14" height="4"/><rect x="283" y="120" width="14" height="4" fill="#5d4037"/>
    <rect x="199" y="261" width="4" height="14"/><rect x="207" y="261" width="4" height="14"/><rect x="215" y="261" width="4" height="14" fill="#5d4037"/>
    <rect x="199" y="315" width="4" height="14"/><rect x="207" y="315" width="4" height="14"/><rect x="215" y="315" width="4" height="14" fill="#5d4037"/>
  </g>
  <g font-size="10" fill="#5f6368">
    <text x="252" y="124">220 Ω</text>
    <text x="215" y="292" text-anchor="middle">220 Ω</text>
    <text x="215" y="346" text-anchor="middle">220 Ω</text>
  </g>

  <!-- ===== LEDs (triangle points from anode to cathode) ===== -->
  <!-- green: vertical, anode on top (from 3V3), cathode to GPIO8 -->
  <polygon points="278,165 302,165 290,193" fill="#34a853" stroke="#188038" stroke-width="2"/>
  <line x1="277" y1="197" x2="303" y2="197" stroke="#188038" stroke-width="3"/>
  <path d="M308 172 l10 -8 M313 182 l10 -8" stroke="#34a853" stroke-width="2"/>
  <text x="250" y="186" font-size="12" font-weight="700" fill="#188038" text-anchor="end">green</text>
  <!-- blue: anode from GPIO8, cathode to GND -->
  <polygon points="160,256 160,280 132,268" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
  <line x1="128" y1="255" x2="128" y2="281" stroke="#1a73e8" stroke-width="3"/>
  <path d="M138 250 l-8 -10 M148 250 l-8 -10" stroke="#4285f4" stroke-width="2"/>
  <text x="144" y="298" font-size="12" font-weight="700" fill="#1a73e8" text-anchor="middle">blue</text>
  <!-- red: anode from GPIO9, cathode to GND -->
  <polygon points="160,310 160,334 132,322" fill="#ea4335" stroke="#c5221f" stroke-width="2"/>
  <line x1="128" y1="309" x2="128" y2="335" stroke="#c5221f" stroke-width="3"/>
  <text x="144" y="352" font-size="12" font-weight="700" fill="#c5221f" text-anchor="middle">red</text>

  <!-- ===== Callouts ===== -->
  <g fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3">
    <path d="M422 302 H440 V297 H520"/>
    <path d="M386 482 H520"/>
  </g>
  <g font-size="12" fill="#202124">
    <text x="526" y="293" font-weight="700">GPIO48 — onboard RGB</text>
    <text x="526" y="309" fill="#5f6368">WS2812 on the board (RMT)</text>
    <text x="526" y="478" font-weight="700">GPIO0 — BOOT button</text>
    <text x="526" y="494" fill="#5f6368">onboard, to GND, active LOW</text>
  </g>

  <!-- GPIO8 truth table -->
  <g font-size="12" fill="#202124">
    <rect x="520" y="60" width="256" height="128" rx="10" fill="#f1f3f4"/>
    <text x="536" y="84" font-weight="700">GPIO8 — two LEDs on one pin</text>
    <text x="536" y="110">output HIGH</text><text x="660" y="110" fill="#1a73e8" font-weight="700">blue on</text>
    <text x="536" y="134">output LOW</text><text x="660" y="134" fill="#188038" font-weight="700">green on</text>
    <text x="536" y="158">input (Hi-Z)</text><text x="660" y="158" fill="#5f6368" font-weight="700">both off</text>
    <text x="536" y="178" font-size="10" fill="#5f6368">3V3 → green → blue → GND needs ~5 V</text>
  </g>
</svg>
